[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "certiscan2d"
version = "1.0.0"
description = "Outil local d'audit et de vérification de documents 2D-Doc"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0.0",
    "pymupdf>=1.24.0",
    "opencv-python-headless>=4.9.0",
    "zxing-cpp>=2.2.0",
    "pytesseract>=0.3.10",
    "numpy>=1.26.0",
    "cryptography>=42.0.0",
    "Pillow>=10.0.0",
]

[project.scripts]
certiscan = "certiscan2d.cli:main"

[tool.setuptools.packages.find]
include = ["certiscan2d*"]